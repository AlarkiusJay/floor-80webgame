<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>OG generator</title>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=VT323&display=swap');
      html,body{margin:0;background:#111;}
      canvas{display:block;margin:10px auto;box-shadow:0 0 0 1px #333;width:760px;height:auto;}
    </style>
  </head>
  <body>
    <canvas id="c" width="1200" height="630"></canvas>
    <script>
      const GREEN = "#16ff0e";

      function background(ctx, W, H) {
        ctx.fillStyle = "#04070a";
        ctx.fillRect(0, 0, W, H);
        const g = ctx.createRadialGradient(W / 2, H / 2, 40, W / 2, H / 2, W * 0.6);
        g.addColorStop(0, "rgba(22,255,14,0.10)");
        g.addColorStop(1, "rgba(0,0,0,0)");
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, W, H);
        ctx.strokeStyle = "rgba(26,158,110,0.10)";
        ctx.lineWidth = 1;
        for (let x = 0; x <= W; x += 48) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
        for (let y = 0; y <= H; y += 48) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
        const v = ctx.createRadialGradient(W / 2, H / 2, H * 0.3, W / 2, H / 2, W * 0.75);
        v.addColorStop(0, "rgba(0,0,0,0)");
        v.addColorStop(1, "rgba(0,0,0,0.5)");
        ctx.fillStyle = v;
        ctx.fillRect(0, 0, W, H);
      }

      // Flat 2D side-profile staircase line, descending left to right,
      // with a wide landing in the middle where the wordmark rests.
      function drawStairLine(ctx, pts) {
        const trace = () => {
          ctx.beginPath();
          pts.forEach((p, i) => (i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])));
        };
        ctx.save();
        ctx.strokeStyle = GREEN;
        ctx.shadowColor = GREEN;
        ctx.lineJoin = "round";
        ctx.lineCap = "round";
        // outer glow
        ctx.lineWidth = 7; ctx.shadowBlur = 24; trace(); ctx.stroke();
        // inner bright core
        ctx.lineWidth = 3.2; ctx.shadowBlur = 10; trace(); ctx.stroke();
        ctx.restore();
      }

      function drawWordmark(ctx, cx, baseY) {
        const size = 116;
        ctx.save();
        ctx.translate(cx, baseY);
        ctx.scale(0.62, 1);
        ctx.font = `${size}px VT323, monospace`;
        ctx.textBaseline = "alphabetic";
        ctx.textAlign = "left";
        const parts = [
          { t: "FL", c: "#ffffff" },
          { t: "80", c: GREEN },
          { t: "R", c: "#ffffff" },
        ];
        const total = parts.reduce((w, p) => w + ctx.measureText(p.t).width, 0);
        let x = -total / 2;
        for (const p of parts) {
          ctx.fillStyle = p.c;
          ctx.shadowColor = p.c === GREEN ? GREEN : "#ffffff";
          ctx.shadowBlur = p.c === GREEN ? 30 : 20;
          ctx.fillText(p.t, x, 0);
          ctx.shadowBlur = p.c === GREEN ? 16 : 10;
          ctx.fillText(p.t, x, 0);
          x += ctx.measureText(p.t).width;
        }
        ctx.restore();
      }

      function drawSubtitle(ctx, cx, baseY) {
        ctx.save();
        ctx.font = "32px 'Share Tech Mono', monospace";
        ctx.textAlign = "center";
        ctx.textBaseline = "alphabetic";
        ctx.letterSpacing = "11px";
        ctx.fillStyle = GREEN;
        ctx.shadowColor = GREEN;
        ctx.shadowBlur = 20;
        ctx.fillText("PUZZLE & LOGIC GAME", cx + 6, baseY);
        ctx.shadowBlur = 9;
        ctx.fillText("PUZZLE & LOGIC GAME", cx + 6, baseY);
        ctx.restore();
      }

      window.renderOG = async function () {
        await document.fonts.load("116px VT323");
        await document.fonts.load("32px 'Share Tech Mono'");
        await document.fonts.ready;
        const cv = document.getElementById("c");
        const ctx = cv.getContext("2d");
        const W = cv.width, H = cv.height;
        background(ctx, W, H);

        // Descending staircase across the whole banner.
        const pts = [
          [0, 190], [120, 190], [120, 232], [220, 232], [220, 274], [320, 274], [320, 316],
          [885, 316],                 // wide landing (wordmark + subtitle clear it)
          [885, 364], [992, 364], [992, 412], [1099, 412], [1099, 460], [1200, 460],
        ];
        drawStairLine(ctx, pts);

        // Wordmark sits on the landing; subtitle floats just below.
        drawWordmark(ctx, 545, 312);
        drawSubtitle(ctx, 545, 370);
        return cv.toDataURL("image/png");
      };
    </script>
  </body>
</html>
